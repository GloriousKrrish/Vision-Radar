services:
  - type: web
    name: vision-radar
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: ".:packages"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: 10000
